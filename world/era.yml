# era.yml — Era 1 configuration. All tunable game values live here.
# Engine reads this file; never hardcode these values in engine/.

era:
  number: 1
  seed: 20260706
  tick_cap: 100                # hard cap; era ends regardless of state
  cadence: manual              # manual | cron expression (e.g. "0 * * * *")

coronation:
  supremacy_threshold: 0.45    # fraction of regions to count as supreme (>45% of 12 = 6)
  k_ticks: 10                  # consecutive supreme ticks to coronate

orders:
  cap_force: 3                 # max orders per batch, forces
  cap_adventurer: 2            # max orders per batch, adventurer
  npc_cap: 1                   # NPC policy emits at most 1 order regardless of caps

economy:
  yield_neutral: 1             # essence per region per tick
  yield_capital: 2
  yield_ring: 2
  recruit_cost: 2              # essence per unit
  fortify_cost:                # escalating: reaching level 3 costs more than level 1
    level_1: 5
    level_2: 10
    level_3: 20
  fortify_bonus:                # cumulative defense bonus AT each level (not a flat multiplier)
    level_1: 2
    level_2: 5
    level_3: 10
  fortify_upkeep:               # essence/tick per fortified region AT each level; unpaid -> erodes 1 level
    level_1: 1
    level_2: 3
    level_3: 6
  fortify_cap: 3
  upkeep_divisor: 5            # essence upkeep per tick: floor(force's total units / this)
  siege_erosion_interval: 2    # ticks between each -1 fortification level a paid siege inflicts
  siege_upkeep: 3              # flat essence/tick per active siege; unpaid -> ends immediately
  decree_surge_surcharge:      # flat surcharge for surge_recruit, by consecutive-tick streak (capped at 3)
    level_1: 5
    level_2: 10
    level_3: 20

combat:
  tie_favors: defender         # frozen: strict determinism, no seed in combat

adventurer:
  baseline_essence: 5
  trade_cost: 3                # flat essence per trade attempt (not a per-tick volume cap)
  trade_success_pct:            # seeded success chance by the region's structural depth tier
    ring: 50
    arm: 75
    capital: 100
  loot_burn_fraction: 0.5      # fraction of essence burned on death
  loot_dissipation_ticks: 5    # M: ticks before regional loot dissipates
  kill_order_cost: 1           # orders consumed by target: adventurer declaration
  personal_quest:              # declared per era; types: accumulate | survive | chain | back_winner
    type: survive
    target: era                # survive the full era

reputation:
  scale_min: -100
  scale_max: 100
  initial: 0
  decay_intra_era: 0           # frozen: no decay, memory is the point
  cataclysm_multiplier: 0.5    # applied at era reset, rounds toward 0
  deltas:
    trade_per_tick: 2
    quest_damages_force: -15
    quest_damages_force_rivals: 10
    refuge_per_tick: 1
  thresholds:
    trade: 10
    refuge: 25
    errands_v2: 40

quests:
  max_active_major: 1
  max_active_minor: 2
  window_ticks: 8              # T = spawn_tick + window
  blockade_n_ticks: 3          # N: consecutive occupation ticks
  attrition_delta: 4           # D: unit reduction target
  rewards:
    raid: 6
    blockade: 5
    attrition: 10
    dethrone: 15
  stakes:
    minor: 1                   # charged at accept
    major: 2
  triggers:
    supremacy_minor: 0.45      # leader fraction spawning minor quests
    supremacy_major: 0.55      # leader fraction spawning major quests
    adventurer_death_vengeance: raid   # spawns raid against the killer

guild:                         # the Adventurers' Guild (docs/intent.md point 9)
  thresholds:                  # reputation with a force to unlock its board's tier
    bronze: 0
    silver: 10                 # aligned with reputation.thresholds.trade
    gold: 25                   # aligned with reputation.thresholds.refuge
    platinum: 70
  platinum_condition:
    force_regions_max: 1       # platinum also requires the board force at <= this many regions
  objectives:
    travel_deadline:           # ticks from spawn to reach the target region
      bronze: 3
      silver: 5
      gold: 7
      platinum: 10
    hold_n_ticks:              # consecutive occupation ticks
      bronze: 1
      silver: 2
      gold: 3
      platinum: 5
  rewards:
    essence:
      bronze_hit: 1            # Bronze pays via a seeded coin-flip: hit or miss
      bronze_miss: 2           # miss doubles the essence (consolation) but pays no reputation
      silver: 3
      gold: 8
      platinum: 25
    reputation:                # positive with the board force; Bronze via the same coin-flip
      bronze: 1
      silver: 1
      gold: 5
      platinum: 15
  stakes:                      # per tier, naming a quests.stakes bucket (minor|major)
    bronze: minor
    silver: minor
    gold: major
    platinum: major
  capabilities:
    sanctuary_ticks: 2         # ticks of hunt immunity granted by sanctuary
    swift_march_hops: 2        # max adjacent hops in one swift_march
    costs:                     # essence charged to invoke each capability
      swift_march: 1
      sanctuary: 2
      insure: 1
      entrench: 2
      wager: 0                 # self-costing: the forfeited stake + reward is the price
    shared:                    # tier -> capability, uniform across all forces
      bronze: swift_march
      silver: sanctuary
    signature:                 # force -> capability, granted at that force's gold tier (persona map)
      force-1: insure
      force-2: entrench
      force-3: wager

map:
  arms: 3
  regions_per_arm: 3           # capital + 2 neutrals
  ring_size: 3

budget:
  tokens_per_era: 0            # 0 = uncapped for tracer bullet; set before first agent era

bootstrap:                     # PROVISIONAL: not specified in docs/intent.md;
                                # bootstrap-only values for seeding era-1 tick-0
                                # state, not calibrated. Revisit before real play.
  starting_essence: 10         # per force, at tick 0
  starting_units_capital: 3    # per capital, at tick 0
