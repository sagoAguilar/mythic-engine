# Expected phase-7 delta. Yield is paid per owned region on post-combat
# ownership (region yield field; capitals and ring pay 2, arms 1 in era 1).
# Ownership alone pays: force-3's 0-unit scorched regions still yield.
# Neutrals pay nobody; the adventurer owns nothing and receives nothing.
# The stale pot on arm-1-b (expired tick 0 < resolving tick 1) dissipates;
# ring-3's live pot stays untouched.
# Upkeep (F5) nets against yield in the same phase: floor(total units /
# upkeep_divisor=5). force-1: 6 units -> 1; force-2: 7 units -> 1;
# force-3: 2 units -> 0 (below the divisor, pays nothing).
essence_changes:
  force-1: 4   # 5 yield - 1 upkeep
  force-2: 5   # 6 yield - 1 upkeep
  force-3: 5   # 5 yield - 0 upkeep
fortification_changes: {}   # no region here is fortified
loot_changes:
  arm-1-b: null
